name: Build San Editor APK
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build APK
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --console=plain 2>&1 | tee build.log
      - name: Ringkasan error
        if: failure()
        run: |
          grep -E "^e: |What went wrong|FAILURE|error:" -A4 build.log | head -120 || true
      - uses: actions/upload-artifact@v4
        with:
          name: SanEditor-release
          path: app/build/outputs/apk/release/*.apk
      - name: Beri nama APK sesuai versi
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/release/*.apk "SanEditor-v${V}.apk"
          ls -la SanEditor-v*.apk
      - name: Rilis (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SanEditor-v*.apk
